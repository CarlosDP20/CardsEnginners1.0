<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asimetrixtech - Buscador de Especialistas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <i class="fas fa-code"></i>
                    <span>Asimetrixtech</span>
                </div>
                <div class="nav-links">
                    <a href="#inicio" class="nav-link">Inicio</a>
                    <a href="#buscar" class="nav-link">Buscar</a>
                    <a href="#equipo" class="nav-link">Equipo</a>
                    <a href="#contacto" class="nav-link">Contacto</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Ingenieros</h1>
            <p class="hero-subtitle">Busca la especialidad que requiere el caso</p>
            <div class="search-box-hero">
                <input type="text" id="searchInputHero" placeholder="Ej: Azure, Java, React, Python...">
                <button onclick="searchFromHero()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- Buscador Principal -->
    <section id="buscar" class="search-section">
        <div class="container">
            <h2>Buscar por Especialidad</h2>
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Escribe una tecnología o especialidad...">
                    <button onclick="searchEngineers()">Buscar</button>
                </div>
                
                <!-- Filtros rápidos -->
                <div class="quick-filters">
                    <span>Filtros rápidos:</span>
                    <button class="filter-btn" onclick="filterByTech('Azure')">Azure</button>
                    <button class="filter-btn" onclick="filterByTech('Java')">Java</button>
                    <button class="filter-btn" onclick="filterByTech('Python')">Python</button>
                    <button class="filter-btn" onclick="filterByTech('React')">React</button>
                    <button class="filter-btn" onclick="filterByTech('AWS')">AWS</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Resultados -->
    <section class="results-section">
        <div class="container">
            <div id="resultsInfo" class="results-info"></div>
            <div id="engineersGrid" class="engineers-grid">
                <!-- Los ingenieros se cargarán aquí dinámicamente -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 TechEngineers. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
